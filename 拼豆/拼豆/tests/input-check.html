<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>输入框联动自检</title>
<style>
  body { margin: 0; background: #0d1117; color: #e6edf3; font: 15px/1.7 ui-monospace, Consolas, monospace; }
  #log { padding: 12px 16px; white-space: pre-wrap; background: #11161e; border-bottom: 1px solid #262f3c; min-height: 220px; }
  .ok { color: #3fb950; }
  .bad { color: #ff7a45; }
  iframe { width: 1180px; height: 640px; border: 0; display: block; }
</style>
</head>
<body>
<pre id="log">自检启动…</pre>
<iframe id="f" src="../index.html#demo"></iframe>
<script>
(function () {
  'use strict';
  const logEl = document.getElementById('log');
  const lines = [];
  function log(text, pass) {
    lines.push((pass === true ? '✓ ' : pass === false ? '✗ ' : '· ') + text);
    logEl.innerHTML = lines.join('\n');
  }

  const frame = document.getElementById('f');
  frame.addEventListener('load', () => setTimeout(run, 1200));

  function run() {
    const d = frame.contentDocument;
    const w = frame.contentWindow;
    if (!d) { log('无法访问 iframe（需要 --allow-file-access-from-files）', false); return; }

    const $ = (id) => d.getElementById(id);
    const fire = (el, type) => el.dispatchEvent(new w.Event(type, { bubbles: true }));
    const type = (el, value) => { el.value = value; fire(el, 'input'); };

    // —— 1. 横向豆数：手输 120 ——
    const colsNum = $('colsNum'), colsRange = $('colsRange');
    type(colsNum, '120');
    log('手输 120 → 滑块 ' + colsRange.value + (colsRange.value === '120' ? ' ✓' : ' ✗'), colsRange.value === '120');

    setTimeout(() => {
      const title = $('stageTitle').textContent;
      log('生成结果：' + title, /120\s*×/.test(title));

      // —— 2. 拖滑块到 44 → 输入框同步 ——
      colsRange.value = '44';
      fire(colsRange, 'input');
      log('拖滑块到 44 → 输入框 ' + colsNum.value + (colsNum.value === '44' ? ' ✓' : ' ✗'), colsNum.value === '44');

      // —— 3. 超范围：手输 999 → 夹到 200 ——
      type(colsNum, '999');
      log('手输 999 → 状态 ' + colsRange.value + (colsRange.value === '200' ? ' ✓' : ' ✗'), colsRange.value === '200');

      // —— 4. 失焦规范化：手输 1 → blur 变 8 ——
      type(colsNum, '1');
      fire(colsNum, 'blur');
      log('手输 1 后失焦 → 输入框 ' + colsNum.value + (colsNum.value === '8' ? ' ✓' : ' ✗'), colsNum.value === '8');

      // —— 5. 最多颜色数：手输 7 ——
      const colorsNum = $('colorsNum'), colorsRange = $('colorsRange');
      type(colorsNum, '7');
      log('颜色数手输 7 → 滑块 ' + colorsRange.value + (colorsRange.value === '7' ? ' ✓' : ' ✗'), colorsRange.value === '7');

      // —— 6. 颜色数清空后失焦：回到当前值 ——
      type(colorsNum, '');
      fire(colorsNum, 'blur');
      log('颜色数清空失焦 → 输入框 ' + colorsNum.value + (colorsNum.value === '7' ? ' ✓' : ' ✗'), colorsNum.value === '7');

      // —— 7. 格子大小：手输 20 ——
      const zoomNum = $('zoomNum'), zoomRange = $('zoomRange');
      type(zoomNum, '20');
      log('格子大小手输 20 → 滑块 ' + zoomRange.value + (zoomRange.value === '20' ? ' ✓' : ' ✗'), zoomRange.value === '20');

      setTimeout(() => {
        const canvas = $('preview');
        const styleW = canvas.style.width;
        const cols = parseInt($('stageTitle').textContent, 10);
        log('预览画布宽度 ' + styleW + '（' + cols + ' 列 × 20px）' +
          (parseInt(styleW, 10) > cols * 20 ? ' ✓' : ' ✗'), parseInt(styleW, 10) > cols * 20);

        // —— 8. 清空 → 自动 ——
        type(zoomNum, '');
        log('清空格子大小 → 滑块 ' + zoomRange.value + (zoomRange.value === '0' ? ' ✓' : ' ✗'), zoomRange.value === '0');

        setTimeout(() => {
          log('清空后画布宽度 ' + $('preview').style.width + '（自动适应）', true);
          log('自检结束', true);
        }, 400);
      }, 500);
    }, 500);
  }
})();
</script>
</body>
</html>
